name: CI/CD FilmoraUz

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Build and Test All Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend Build Check
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Backend Test
        run: |
          cd backend
          go test ./...

      - name: Bot Test
        run: |
          cd bot
          go test ./...

      - name: Worker Test
        run: |
          cd worker
          go test ./...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parser Syntax/Test
        run: |
          cd parser
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m py_compile $(find . -name "*.py" -not -path "./venv/*")
          if [ -d tests ]; then
            pip install pytest
            python -m pytest tests
          fi

  deploy-web:
    name: Deploy Web VPS
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Deploy to Web VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WEB_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Deploying WEB server..."
            cd /opt/filmorauz
            make vps-pull-web
            echo "✅ WEB deployment completed"

  deploy-worker:
    name: Deploy Worker VPS
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Deploy to Worker VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Deploying WORKER server..."
            cd /opt/filmorauz
            make vps-pull-worker
            echo "✅ WORKER deployment completed"
