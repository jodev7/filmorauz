name: Deploy FilmoraUz

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-web:
  needs: ci
  runs-on: ubuntu-latest
  steps:
    - name: Deploy to Web VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.WEB_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "Deploying web server..."
          cd /opt/filmorauz
          make vps-pull-web
          echo "Deployment completed"

  deploy-worker:
  needs: ci
  runs-on: ubuntu-latest
  steps:
    - name: Deploy to Worker VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.WORKER_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "Deploying worker server..."
          cd /opt/filmorauz
          make vps-pull-worker
          echo "Deployment completed"
