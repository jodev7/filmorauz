name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "bot/**"
  workflow_dispatch:

jobs:
  ci-web:
    name: Build and Test Web Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Build Check
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Backend Test
        run: |
          cd backend
          go test ./...

      - name: Bot Test
        run: |
          cd bot
          go test ./...

  deploy-web:
    name: Deploy Web VPS
    runs-on: ubuntu-latest
    needs: ci-web

    steps:
      - name: Deploy to Web VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WEB_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Deploying WEB server..."
            cd /opt/filmorauz
            make vps-pull-web
            echo "WEB deployment completed"
